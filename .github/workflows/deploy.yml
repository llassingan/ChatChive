name: Deploy

# Deploy via the Dokploy webhook (backlog E1-4). `dist/` is built here and the
# host pulls the deployment; the workflow itself only triggers it.
#
# The webhook URL is a *secret* (`DOKPLOY_DEPLOY_WEBHOOK`), never a plain
# variable and never written to the log. It carries the application's
# `refreshToken`, which is a bearer credential: anyone holding the URL can
# trigger a deploy, so it is masked by GitHub's secret store and passed to the
# payload on the wire only.
#
# The workflow is inert until the owner configures it. With no secret a deploy
# job that failed on every push would only train the owner to ignore a red X, so
# the jobs report that deploy is not configured and exit 0 instead. Add the
# secret and the same jobs deploy with no edits to this file:
#
#   Secret  DOKPLOY_DEPLOY_WEBHOOK  Dokploy > Application > Deployments >
#                                   Webhook URL (ends in `/api/deploy/<token>`)
#
# The body sent is `{}`: Dokploy's generic webhook matches the application by
# the token in the URL and checks the branch against the application's own
# configuration, so no branch or payload fields are needed.
#
# The live deploy is unverified: nothing here has run against a real Dokploy
# instance, because none exists yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Queue rather than cancel: a superseded push must still land before the next
  # one starts, or the newest commit can be overwritten by the older deploy.
  deploy:
    name: Deploy via Dokploy
    runs-on: ubuntu-latest
    concurrency:
      group: dokploy-deploy
      cancel-in-progress: false
    steps:
      - name: Check deploy configuration
        id: config
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy is not configured
        if: steps.config.outputs.configured != 'true'
        run: |
          echo "::notice title=Deploy not configured::Skipping deploy. Add the DOKPLOY_DEPLOY_WEBHOOK secret to enable it (README, Deploy)."

      - name: Trigger the Dokploy webhook
        if: steps.config.outputs.configured == 'true'
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          # The URL is never echoed. `--fail-with-body` turns a 4xx/5xx into a
          # failed step while still printing Dokploy's message (e.g. "Branch Not
          # Match"), which is the diagnostic the owner needs; the URL itself
          # stays out of the log because only the response body is printed.
          status=$(curl --silent --show-error --fail-with-body \
            --output /tmp/dokploy-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$WEBHOOK" || true)
          echo "Dokploy responded with HTTP $status"
          cat /tmp/dokploy-response.txt 2>/dev/null || true
          case "$status" in
            2*) exit 0 ;;
            *) echo "::error title=Dokploy deploy failed::Webhook returned HTTP $status (see the response above)."; exit 1 ;;
          esac
