<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Privacy lock-down (PRD §8 S-1,S-2,S-3,S-5; backlog E1-3). Finalized.
      Required set (S-2): default-src / connect-src / img-src / media-src /
      script-src. The rest is hardening:
        style-src 'self' 'unsafe-inline' (Vite injects component styles as
          inline <style>; no remote stylesheet is ever loaded).
        font-src 'self' (system fonts only, no Google Fonts; S-2).
        worker-src 'self' blob: (the parse/unzip worker; E2-6).
        object-src/base-uri/form-action (lock down plugins, base tag, form posts).
      frame-ancestors 'none' is deliberately NOT in this meta tag: browsers ignore
      frame-ancestors delivered via <meta> and log an error for it, so it belongs
      only in the response-header mirror the static host adds (plus X-Frame-Options).
      See src/ui/README.md "CSP host-header mirror" and backlog E1-4 (deploy).
      No third-party script, font, CDN, analytics or error reporting (S-2).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <!--
      Inline favicon (data URI): no network request, which the no-network promise
      requires. Same geometry as the brand mark in src/ui/brand/Mark.tsx, on the
      accent tile the landing page uses, so the tab icon and the page agree. Keep
      the two in step by hand.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%2321C063%22/%3E%3Cg transform=%22translate(3.36 3.36) scale(0.72)%22 fill=%22none%22 stroke=%22%230B0B0B%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M8 2.75h8a4.5 4.5 0 0 1 4.5 4.5v2a4.5 4.5 0 0 1-4.5 4.5H8A4.5 4.5 0 0 1 3.5 9.25V7.25A4.5 4.5 0 0 1 8 2.75Z%22/%3E%3Cpath d=%22M10.2 13.35Q3.43 14.4 3.8 21.25Q9.02 18.94 10.2 13.35Z%22/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Open a WhatsApp chat export in your browser. Nothing is uploaded. Not affiliated with WhatsApp or Meta."
    />
    <title>ChatChive: read your chat export privately</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
